name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Root suite (editor + prompt engine)
        run: |
          npm install
          npm test

      - name: Backend suite (buildArgs)
        working-directory: backend
        run: |
          npm install
          npm test
